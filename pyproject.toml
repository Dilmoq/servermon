[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "servermon"
version = "1.0.0"
description = "Lightweight server monitoring CLI: CPU/RAM/disk snapshots, alerts, SQLite history"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Dilmoq" }]
keywords = ["monitoring", "cli", "psutil", "linux", "devops"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Monitoring",
]
dependencies = ["psutil>=5.9,<8.0"]

[project.urls]
Homepage = "https://github.com/Dilmoq/servermon"

[project.scripts]
servermon = "servermon.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.0,<9.0", "ruff>=0.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "C4"]
ignore = ["B008"]
